services:
  backend:
    build: .
    container_name: aarambh_backend
    restart: always
    env_file: .env
    expose: ["5000"]

  caddy:
    image: caddy:2
    container_name: aarambh_caddy
    restart: always
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on: [backend]

volumes:
  caddy_data: