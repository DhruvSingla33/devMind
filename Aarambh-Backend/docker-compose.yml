version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aarambh_backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/aarambh_db
      - JWT_SECRET=aarambh_super_secret_jwt_access_token_key_2026!
      - JWT_REFRESH_SECRET=aarambh_super_secret_jwt_refresh_token_key_2026!
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0
    container_name: aarambh_mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
