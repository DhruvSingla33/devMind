<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="Poppins, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A6B"/><stop offset="1" stop-color="#E63946"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE29A"/><stop offset="1" stop-color="#FFB703"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#E63946" flood-opacity=".18"/></filter>
    <filter id="btn" x="-20%" y="-40%" width="140%" height="200%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#E63946" flood-opacity=".35"/></filter>
  </defs>
  <rect width="390" height="844" fill="#FFF8F6"/>

  <!-- Hero -->
  <path d="M0 0 H390 V330 C320 372 70 372 0 330 Z" fill="url(#bg)"/>
  <circle cx="350" cy="60" r="110" fill="#fff" opacity=".07"/>
  <circle cx="20" cy="300" r="80" fill="#fff" opacity=".06"/>
  <g fill="#fff" opacity=".5"><circle cx="70" cy="110" r="3"/><circle cx="320" cy="210" r="2.5"/><circle cx="90" cy="230" r="2"/><circle cx="300" cy="120" r="2"/></g>

  <!-- status bar -->
  <g font-size="15" font-weight="600" fill="#fff">
    <text x="32" y="30">9:41</text>
    <g transform="translate(288 19)"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g>
    <rect x="318" y="19" width="25" height="12" rx="3.5" fill="none" stroke="#fff" stroke-width="1.2"/><rect x="320" y="21" width="18" height="8" rx="2"/><rect x="344" y="23" width="2" height="4" rx="1"/>
  </g>

  <!-- illustration: sun rising from book -->
  <circle cx="195" cy="150" r="50" fill="url(#sun)"/>
  <g stroke="#FFE29A" stroke-width="7" stroke-linecap="round">
    <line x1="195" y1="76" x2="195" y2="62"/><line x1="143" y1="98" x2="133" y2="88"/><line x1="247" y1="98" x2="257" y2="88"/>
    <line x1="122" y1="150" x2="108" y2="150"/><line x1="268" y1="150" x2="282" y2="150"/>
  </g>
  <path d="M195 190 C165 172 130 170 100 180 L100 248 C130 238 165 240 195 258 Z" fill="#fff"/>
  <path d="M195 190 C225 172 260 170 290 180 L290 248 C260 238 225 240 195 258 Z" fill="#FDECEC"/>
  <text x="195" y="300" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">Aarambh</text>

  <!-- card -->
  <rect x="20" y="340" width="350" height="420" rx="28" fill="#fff" filter="url(#sh)"/>
  <text x="44" y="388" font-size="22" font-weight="700" fill="#2B2D42">Let's get started 👋</text>
  <text x="44" y="412" font-size="13" fill="#6B6B6B">Login or sign up to continue learning</text>

  <!-- tabs -->
  <rect x="44" y="432" width="302" height="44" rx="14" fill="#FFF1EF"/>
  <rect x="48" y="436" width="147" height="36" rx="11" fill="#fff" filter="url(#sh)"/>
  <text x="121" y="459" text-anchor="middle" font-size="14" font-weight="700" fill="#E63946">Phone</text>
  <text x="270" y="459" text-anchor="middle" font-size="14" font-weight="600" fill="#9A9A9A">Email</text>

  <!-- phone input -->
  <text x="44" y="508" font-size="12" font-weight="700" fill="#6B6B6B" letter-spacing=".5">MOBILE NUMBER</text>
  <rect x="44" y="518" width="302" height="56" rx="16" fill="#fff" stroke="#E63946" stroke-width="1.6"/>
  <text x="62" y="552" font-size="15" font-weight="600" fill="#2B2D42">🇮🇳 +91</text>
  <line x1="128" y1="534" x2="128" y2="558" stroke="#F1D5D5"/>
  <text x="142" y="552" font-size="16" font-weight="600" fill="#2B2D42" letter-spacing="1">98765 43210</text>
  <circle cx="324" cy="546" r="11" fill="#2EC27E"/><path d="M318 546 l4 4 l8 -8" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>

  <!-- CTA -->
  <rect x="44" y="594" width="302" height="56" rx="18" fill="url(#bg)" filter="url(#btn)"/>
  <text x="195" y="628" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Get OTP  →</text>

  <!-- divider -->
  <line x1="44" y1="680" x2="160" y2="680" stroke="#F1E4E4"/><line x1="230" y1="680" x2="346" y2="680" stroke="#F1E4E4"/>
  <text x="195" y="685" text-anchor="middle" font-size="12" fill="#9A9A9A">or</text>

  <!-- google -->
  <rect x="44" y="700" width="302" height="48" rx="16" fill="#fff" stroke="#EBE3E3"/>
  <g transform="translate(118 714)">
    <path d="M20 10.2c0-.7-.1-1.4-.2-2H10v3.8h5.6a4.8 4.8 0 0 1-2.1 3.1v2.6h3.4c2-1.8 3.1-4.5 3.1-7.5z" fill="#4285F4"/>
    <path d="M10 20.5c2.8 0 5.2-.9 6.9-2.5l-3.4-2.6c-.9.6-2.1 1-3.5 1-2.7 0-5-1.8-5.8-4.3H.7v2.7A10.4 10.4 0 0 0 10 20.5z" fill="#34A853"/>
    <path d="M4.2 12.1a6.2 6.2 0 0 1 0-4V5.4H.7a10.4 10.4 0 0 0 0 9.4l3.5-2.7z" fill="#FBBC05"/>
    <path d="M10 4.1c1.5 0 2.9.5 4 1.5l3-3A10.4 10.4 0 0 0 .7 5.4l3.5 2.7C5 5.9 7.3 4.1 10 4.1z" fill="#EA4335"/>
  </g>
  <text x="148" y="729" font-size="14" font-weight="600" fill="#2B2D42">Continue with Google</text>

  <text x="195" y="794" text-anchor="middle" font-size="11" fill="#9A9A9A">By continuing you agree to our</text>
  <text x="195" y="810" text-anchor="middle" font-size="11" font-weight="600" fill="#E63946">Terms of Service · Privacy Policy</text>
  <rect x="128" y="828" width="134" height="5" rx="2.5" fill="#2B2D42"/>
</svg>
