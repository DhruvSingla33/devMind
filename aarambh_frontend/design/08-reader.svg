  <text x="195" y="66" text-anchor="middle" font-size="12" fill="#6B6B6B">Chapter 4</text>
  <text x="195" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#2B2D42">Linear Equations</text>
  <circle cx="346" cy="70" r="20" fill="#FDECEC"/><text x="346" y="76" text-anchor="middle" font-size="16">🔖</text>
  <rect x="24" y="108" width="342" height="4" rx="2" fill="#F1E4E4"/><rect x="24" y="108" width="222" height="4" rx="2" fill="#E63946"/>
  <text x="24" y="160" font-size="20" font-weight="700" fill="#2B2D42">4.2 Linear Equations in Two Variables</text>
  <g font-size="15" fill="#3A3A4A">
    <text x="24" y="200">An equation which can be put in the form</text>
    <text x="24" y="224">ax + by + c = 0, where a, b and c are real</text>
    <text x="24" y="248">numbers, and a and b are not both zero, is</text>
    <text x="24" y="272">called a linear equation in two variables.</text>
  </g>
  <rect x="24" y="298" width="342" height="92" rx="16" fill="#FFF3DC"/><rect x="24" y="298" width="5" height="92" fill="#FFB703"/>
  <text x="44" y="326" font-size="13" font-weight="700" fill="#B07A00">💡 KEY POINT</text>
  <text x="44" y="352" font-size="14" fill="#3A3A4A">Every solution of the equation is a</text>
  <text x="44" y="374" font-size="14" fill="#3A3A4A">point on the line representing it.</text>
  <rect x="24" y="414" width="342" height="190" rx="16" fill="#fff" stroke="#F4E3E3"/>
  <line x1="60" y1="580" x2="340" y2="580" stroke="#C4C4C4"/><line x1="80" y1="430" x2="80" y2="595" stroke="#C4C4C4"/>
  <line x1="70" y1="590" x2="330" y2="440" stroke="#E63946" stroke-width="3"/>
  <circle cx="157" cy="545" r="5" fill="#4D8DF7"/><circle cx="244" cy="495" r="5" fill="#4D8DF7"/>
  <text x="250" y="470" font-size="13" font-weight="600" fill="#E63946">2x − 3y = 6</text>
  <text x="24" y="644" font-size="15" fill="#3A3A4A">Example 1: Find two solutions of</text>
  <text x="24" y="668" font-size="15" fill="#3A3A4A">2x + 3y = 12.</text>
