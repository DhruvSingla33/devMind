<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diagnose the Patient</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4F8;--surface:#FFFFFF;--ink:#152238;--muted:#5A6878;--line:#D5DEE8;--chip:#E3EAF2;
  --accent:#5B4BDB;--accent-ink:#FFFFFF;--ok:#167A4C;--ok-bg:#DDF3E7;--bad:#B3261E;--bad-bg:#FCE7E4;--star:#F2A900;
  --med:#E0564B;--sur:#2F7DD8;--obg:#C2479A;--ped:#E08A1E;
  --ecg-bg:#FFF4F4;--ecg-grid:#F6C9C9;--ecg-grid2:#EE9E9E;
  --mon:#0D1A1E;--mon-line:#20343A;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1320;--surface:#171E2E;--ink:#E6EBF4;--muted:#9AA6B8;--line:#28324A;--chip:#212A3E;
    --accent:#9C90FF;--accent-ink:#120C33;--ok:#71D7A0;--ok-bg:#12301F;--bad:#F4958B;--bad-bg:#3A1C1A;--star:#FFC53D;
    --med:#F07A6F;--sur:#64A6F2;--obg:#E47BC2;--ped:#F2AA4C;
    --ecg-bg:#201719;--ecg-grid:#3D2529;--ecg-grid2:#5C3237;
    --mon:#070D15;--mon-line:#1B2636;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1320;--surface:#171E2E;--ink:#E6EBF4;--muted:#9AA6B8;--line:#28324A;--chip:#212A3E;
  --accent:#9C90FF;--accent-ink:#120C33;--ok:#71D7A0;--ok-bg:#12301F;--bad:#F4958B;--bad-bg:#3A1C1A;--star:#FFC53D;
  --med:#F07A6F;--sur:#64A6F2;--obg:#E47BC2;--ped:#F2AA4C;
  --ecg-bg:#201719;--ecg-grid:#3D2529;--ecg-grid2:#5C3237;
  --mon:#070D15;--mon-line:#1B2636;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1rem;line-height:1.5;-webkit-text-size-adjust:100%;overflow-x:hidden}
#app{max-width:720px;margin:0 auto;padding:1.25rem 1rem 7.5rem}
h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.1;margin:0}
h1{font-size:clamp(2.3rem,10vw,3.6rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.55rem;font-weight:800}
h3{font-size:1.15rem;font-weight:800;margin:1.6rem 0 .6rem}
p{margin:.5rem 0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.star{color:var(--star)} .star.off{color:var(--line)}

/* home */
.hero{display:flex;align-items:center;gap:1rem;margin-bottom:.4rem}
.hero-av{width:76px;flex-shrink:0}
.intro{color:var(--muted);max-width:34rem;margin:.6rem 0 1rem}
.rank{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:1rem;margin:0 0 1.1rem;display:grid;grid-template-columns:auto 1fr auto;gap:.2rem .9rem;align-items:center}
.rank-emoji{font-size:2.2rem;grid-column:1;grid-row:1 / span 2}
.rank-title{grid-column:2;grid-row:1}.rank-sub{grid-column:2;grid-row:2}
.rank-title{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.25rem}
.rank-sub{font-size:.88rem;color:var(--muted)}
.rank-stars{grid-column:3;grid-row:1 / span 2;text-align:right;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.35rem}
.rank-stars small{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-weight:400;font-size:.78rem;color:var(--muted)}
.progress{grid-column:1 / -1;grid-row:3;height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin-top:.5rem}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--star),var(--ped));border-radius:4px}
.rules{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1rem;font-size:.85rem}
.rules span{background:var(--chip);border-radius:999px;padding:.25rem .7rem}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding:.2rem 0 .6rem;margin:0 -1rem;padding-left:1rem;padding-right:1rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.45rem .85rem;font-weight:700;font-size:.92rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip em{font-style:normal;font-weight:400;opacity:.7;margin-left:.2rem}
.group-h{display:flex;align-items:center;justify-content:space-between;margin:1.4rem 0 .6rem}
.group-h h3{margin:0;display:flex;align-items:center;gap:.5rem}
.group-h .gem{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:1.15rem;background:color-mix(in srgb,var(--c) 18%,transparent)}
.group-h small{color:var(--muted);font-size:.85rem}
.cards{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
.card{display:grid;grid-template-columns:56px 1fr auto;gap:.85rem;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:.7rem .85rem;border-left:5px solid var(--c)}
.card:hover{border-color:var(--c)}
.card .who{font-weight:700;line-height:1.25}
.card .cc{color:var(--muted);font-size:.92rem;line-height:1.3;margin-top:.15rem}
.card .meta{text-align:right;font-size:.8rem;color:var(--muted);white-space:nowrap}
.card .meta .stars{font-size:1rem;letter-spacing:.05em}
.av{display:block;width:100%;height:auto}
.random{width:100%;margin:.2rem 0 .4rem}
.more{display:block;width:100%;margin-top:.6rem;background:none;border:1.5px dashed var(--c);border-radius:14px;padding:.7rem;font-weight:700;color:var(--ink)}
.foot{margin-top:2rem;font-size:.82rem;color:var(--muted)}

/* case */
.back{background:none;border:0;padding:.3rem 0;color:var(--muted);margin-bottom:.6rem}
.pt{display:flex;gap:.9rem;align-items:flex-end}
.pt-av{width:92px;flex-shrink:0}
.bubble{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:18px 18px 18px 4px;padding:.7rem .9rem;font-size:1.08rem;font-weight:700;margin-bottom:.6rem}
.pt-info{margin:.8rem 0 0}
.pt-info h2{font-size:1.35rem}
.tag{display:inline-block;font-size:.8rem;font-weight:700;border-radius:6px;padding:.1rem .5rem;margin:.35rem .3rem 0 0;background:color-mix(in srgb,var(--c) 18%,transparent)}
.monitor{background:var(--mon);border-radius:14px;display:grid;grid-template-columns:repeat(5,1fr);margin:1rem 0;overflow:hidden;border:1px solid var(--mon-line)}
.vital{padding:.55rem .5rem .6rem;border-right:1px solid var(--mon-line);min-width:0;position:relative}
.vital:last-child{border-right:0}
.vital small{display:block;font-size:.7rem;color:#8FA6AD;white-space:nowrap}
.vital span{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(1.05rem,4.6vw,1.6rem);line-height:1.1;white-space:nowrap;font-variant-numeric:tabular-nums}
.vital.ab::after{content:"";position:absolute;top:.5rem;right:.45rem;width:7px;height:7px;border-radius:50%;background:#FB7185}
@media (prefers-reduced-motion:no-preference){.vital.ab::after{animation:blink 1s steps(2,start) infinite}}
@keyframes blink{to{visibility:hidden}}
.v-hr{color:#4ADE80}.v-bp{color:#FB7185}.v-spo2{color:#67E8F9}.v-rr{color:#FDE047}.v-t{color:#E5E7EB}
@media (max-width:420px){.monitor{grid-template-columns:repeat(3,1fr)}.vital:nth-child(3){border-right:0}.vital:nth-child(n+4){border-top:1px solid var(--mon-line)}}
.senior{background:color-mix(in srgb,var(--star) 16%,var(--surface));border:1.5px dashed var(--star);border-radius:14px;padding:.7rem .9rem;margin:0 0 1rem;display:flex;gap:.6rem}
.senior b{display:block;font-size:.82rem}
.tabs{display:flex;background:var(--chip);border-radius:14px;padding:4px;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tab{flex:1;border:0;background:none;padding:.55rem .2rem;border-radius:10px;font-weight:700;font-size:.9rem;line-height:1.2}
.tab[aria-selected="true"]{background:var(--surface);box-shadow:0 1px 0 var(--line)}
.tab em{display:block;font-style:normal;color:var(--muted);font-weight:400;font-size:.75rem}
.qlist{list-style:none;margin:.9rem 0 0;padding:0}
.qlist li{margin-bottom:.55rem}
.ask{display:flex;justify-content:space-between;align-items:center;gap:1rem;width:100%;text-align:left;background:var(--surface);border:1.5px dashed var(--line);border-radius:14px;padding:.8rem .9rem}
.ask:hover{border-color:var(--accent)}
.cost{flex-shrink:0;font-size:.78rem;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:999px;padding:.1rem .5rem}
.found{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:.75rem .9rem}
.found .q{font-size:.82rem;color:var(--muted)}
.found .a{margin-top:.15rem;font-weight:700}
.found .visbox{margin-top:.6rem}
@media (prefers-reduced-motion:no-preference){.found.fresh{animation:pop .4s ease-out}}
@keyframes pop{0%{transform:scale(.97);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}100%{transform:none;background:var(--surface)}}
.vis{display:block;width:100%;height:auto;max-width:420px;border-radius:10px}
.vis.bodymap{max-width:290px}
.vt.dark{fill:#4A1F6E}.vl.dark{stroke:#4A1F6E}.vis.tubes{max-width:250px}
.vl{stroke:#FFD84D;stroke-width:1.2}
.vt{fill:#FFD84D;font:700 10px "Atkinson Hyperlegible",sans-serif}
.ebg{fill:var(--ecg-bg)}.eg{stroke:var(--ecg-grid);stroke-width:.5}.eg2{stroke:var(--ecg-grid2);stroke-width:.9}
.etr{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.elab{fill:var(--ink);font:700 10px "Atkinson Hyperlegible",sans-serif}.ehl{fill:var(--bad);font:700 10px "Atkinson Hyperlegible",sans-serif}
.bodyfill{fill:var(--chip);stroke:var(--muted);stroke-width:1.2}
.armline{stroke:var(--chip);stroke-width:15;stroke-linecap:round;fill:none}
.armedge{stroke:var(--muted);stroke-width:17.4;stroke-linecap:round;fill:none}
.spot{fill:var(--bad)} .spot-halo{fill:var(--bad);opacity:.25}
@media (prefers-reduced-motion:no-preference){.spot-halo{animation:halo 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}}
@keyframes halo{50%{transform:scale(1.5);opacity:.08}}
.spot-t{fill:var(--ink);font:700 10px "Atkinson Hyperlegible",sans-serif}
.side-t{fill:var(--muted);font:10px "Atkinson Hyperlegible",sans-serif}
.arrow{stroke:var(--bad);stroke-width:2;fill:none;stroke-dasharray:4 3}
.tube-glass{fill:var(--surface);stroke:var(--muted);stroke-width:1.5}
.tube-t{fill:var(--ink);font:700 10px "Atkinson Hyperlegible",sans-serif}
.labs{display:grid;gap:.6rem;max-width:420px}
.lab-top{display:flex;justify-content:space-between;font-size:.85rem}
.lab-top b.hi{color:var(--bad)}
.lab-bar{position:relative;height:10px;background:var(--chip);border-radius:5px;margin-top:.25rem}
.lab-bar .norm{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ok) 35%,transparent);border-radius:5px}
.lab-bar .mk{position:absolute;top:-4px;width:6px;height:18px;margin-left:-3px;border-radius:3px;background:var(--ink)}
.lab-bar .mk.hi{background:var(--bad)}
.lab-key{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:.35rem}
.lab-key span{display:inline-block;width:18px;height:8px;border-radius:4px;background:color-mix(in srgb,var(--ok) 35%,transparent)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1.5px solid var(--line);padding:.65rem 1rem calc(.65rem + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:.6rem}
.pts{flex:1;font-size:.78rem;color:var(--muted);line-height:1.15;min-width:0}
.pts b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.45rem;color:var(--ink);margin-right:.3rem}
.pts .stars{font-size:.95rem;display:block;margin-top:.1rem}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:.8rem 1.1rem;font-weight:700}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:.75rem 1rem;font-weight:700}
.ghost:disabled{opacity:.45;cursor:not-allowed}
.sheet-bg{position:fixed;inset:0;background:rgba(5,8,18,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:1.2rem 1rem calc(1rem + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.sheet p{margin:.3rem 0 1rem;color:var(--muted)}
.opt{display:block;width:100%;text-align:left;background:none;border:1.5px solid var(--line);border-radius:14px;padding:.8rem .9rem;margin-bottom:.5rem;font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.sheet-actions{display:flex;gap:.6rem;justify-content:flex-end;margin-top:.8rem}

/* result */
.verdict{border-radius:22px;padding:1.1rem 1rem;margin:.2rem 0 1rem;display:flex;gap:1rem;align-items:center}
.verdict.ok{background:var(--ok-bg)}.verdict.no{background:var(--bad-bg)}
.verdict .v-av{width:88px;flex-shrink:0}
.verdict h2{font-size:1.7rem}
.verdict.ok h2{color:var(--ok)}.verdict.no h2{color:var(--bad)}
.verdict .say{font-size:.95rem;margin:.2rem 0 .4rem}
.bigstars{font-size:1.9rem;letter-spacing:.08em;line-height:1}
@media (prefers-reduced-motion:no-preference){.bigstars .star:not(.off){display:inline-block;animation:spin .6s cubic-bezier(.3,1.6,.5,1) both}.bigstars .star:nth-child(2){animation-delay:.15s}.bigstars .star:nth-child(3){animation-delay:.3s}}
@keyframes spin{from{transform:scale(0) rotate(-120deg)}to{transform:none}}
.score-line{font-size:.9rem;color:var(--muted);margin-top:.35rem}
.score-line b{color:var(--ink);font-family:"Bricolage Grotesque",sans-serif;font-size:1.1rem}
.dx{font-size:1.25rem;font-weight:700;margin:.15rem 0}
.clues{list-style:none;padding:0;margin:0}
.clues li{padding:.55rem 0;border-bottom:1px solid var(--line)}
.clues li small{display:block;color:var(--muted);font-size:.82rem}
.mark-ok{color:var(--ok);font-weight:700;margin-right:.35rem}
.mark-no{color:var(--bad);font-weight:700;margin-right:.35rem}
.pearls{list-style:none;margin:0;padding:0}
.pearls li{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:.65rem .85rem .65rem 2.4rem;margin-bottom:.5rem;position:relative}
.pearls li::before{content:"💡";position:absolute;left:.8rem;top:.62rem}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.6rem}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:40;border-radius:2px;pointer-events:none;animation:fall 2.4s cubic-bezier(.25,.6,.5,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--rot));opacity:.8}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const COST={H:3,E:4,T:5}; const START=100; const HINT=10;
const SUBJ=[
 {id:"Medicine",e:"🫀",c:"var(--med)"},
 {id:"Surgery",e:"✂️",c:"var(--sur)"},
 {id:"OBGY",e:"🤰",c:"var(--obg)"},
 {id:"Pediatrics",e:"🧸",c:"var(--ped)"}
];
const subj=id=>SUBJ.find(s=>s.id===id);
const RANKS=[[0,"Medical student","📚"],[10,"Intern","🩺"],[40,"Junior resident","🥼"],[100,"Senior resident","🧠"],[180,"Consultant","🏅"],[260,"Head of department","👑"]];

/* ---------- visuals ---------- */
let uid=0;
const sv=(vb,inner,label,cls="")=>`<svg viewBox="${vb}" class="vis ${cls}" role="img" aria-label="${label}" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
function tl(t,side,ty,px,py,W,dark){const w=t.length*5.4;const x=side==="l"?5:W-5;const lx=side==="l"?x+w+3:x-w-3;const c=dark?" dark":"";return `<text x="${x}" y="${ty}" text-anchor="${side==="l"?"start":"end"}" class="vt${c}">${t}</text><line x1="${lx}" y1="${ty-3}" x2="${px}" y2="${py}" class="vl${c}"/>`;}

function ecg(rows,fast){
 const W=320,RH=46,H=rows.length*RH+6;let g="";
 for(let x=0;x<=W;x+=8)g+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" class="${x%40?"eg":"eg2"}"/>`;
 for(let y=0;y<=H;y+=8)g+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" class="${y%40?"eg":"eg2"}"/>`;
 let tr="";
 rows.forEach(([lead,st,o],i)=>{
  const irr=o==="irr",peak=o==="peak",sp=fast?44:64,s=irr?.62:sp/64,y=i*RH+32;
  const gaps=[40,58,44,70,48,62,42,52];let d=`M0,${y}`,x=4,gi=0;
  while(x+58*s<W-4){const f=n=>(x+n*s).toFixed(1);
   d+=irr?` L${f(4)},${y+1.5} L${f(8)},${y-1.5} L${f(12)},${y+1.5} L${f(16)},${y-1.5} L${f(22)},${y}`:` L${f(8)},${y} Q${f(12)},${y-5} ${f(16)},${y} L${f(22)},${y}`;
   d+=` L${f(24)},${y+3} L${f(28)},${y-24} L${f(32)},${y+7} L${f(35)},${y-st} L${f(42)},${y-st}`;
   d+=peak?` L${f(47)},${y-st-22} L${f(52)},${y} L${f(58)},${y}`:` Q${f(50)},${y-st-10} ${f(58)},${y}`;
   x+=irr?gaps[gi++%gaps.length]:sp;}
  d+=` L${W},${y}`;
  const note=st>0?"ST elevated":st<0?"ST depressed":irr?"irregular, no P waves":peak?"tall peaked T":"";
  tr+=`<path d="${d}" class="etr"/><text x="6" y="${i*RH+13}" class="elab">${lead}</text>`;
  if(note)tr+=`<text x="${W-6}" y="${i*RH+13}" text-anchor="end" class="ehl">${note}</text>`;
 });
 return sv(`0 0 ${W} ${H}`,`<rect width="${W}" height="${H}" class="ebg"/>${g}${tr}`,"ECG tracing");
}

function cxr(f){
 const has=k=>f.includes(k),hyper=has("hyper"),B=hyper?182:164,W=200,lungC=has("boot")?"#0f0f0f":"#1c1c1c";
 let s=`<rect width="200" height="205" fill="#0b0b0b"/><rect x="16" y="12" width="168" height="186" rx="44" fill="#5c5c5c"/>`;
 s+=`<path d="M93,36 C72,34 50,58 45,96 C41,128 42,150 44,${B+4} C62,${hyper?B:B-10} 80,${hyper?B:B-12} 95,${B-2} Z" fill="${has("ptx")?"#030303":lungC}"/>`;
 s+=`<path d="M107,36 C128,34 150,58 155,96 C159,128 158,150 156,${B+4} C138,${hyper?B:B-10} 120,${hyper?B:B-12} 105,${B-2} Z" fill="${lungC}"/>`;
 const vc=has("boot")?"#2a2a2a":"#474747";
 if(!has("ptx"))s+=`<path d="M92,96 l-30,-40 M92,96 l-38,-6 M92,96 l-34,30 M92,96 l-24,52" stroke="${vc}" stroke-width="1.5" fill="none"/>`;
 s+=`<path d="M108,96 l30,-40 M108,96 l38,-6 M108,96 l34,30 M108,96 l24,52" stroke="${vc}" stroke-width="1.5" fill="none"/>`;
 if(has("ptx"))s+=`<path d="M92,60 C80,64 72,86 72,108 C72,128 80,144 92,148 Z" fill="#2a2a2a" stroke="#ececec" stroke-width="1.6"/>`;
 s+=`<ellipse cx="130" cy="${B+11}" rx="10" ry="5" fill="#222"/>`;

const SKINS=["#C68A5E","#B97A55","#A86F4C","#9C6544","#C9906A","#D19E78","#B5815B","#C48C66","#8E5A3C","#D7A57E"],HAIRC=["#1E1410","#2A1A12","#3B2416","#151010"];
function autoAv(c){const h=[...c.id].reduce((a,ch)=>a+ch.charCodeAt(0),0),w=c.who.toLowerCase();
 const baby=/month|day|hour|week|baby/.test(w),age=baby?0:+((w.match(/\d+/)||[30])[0]);
 const f=c.g?c.g==="f":/female|girl|pregnant|woman|delivered|after birth|in labour/.test(w),kid=age<13;
 const hair=kid?(age<2?"tuft":(f?"pig":"short")):f?(h%2?"long":"bun"):(age>60&&h%2?"bald":"short");
 return {kid,skin:SKINS[h%SKINS.length],hair,hc:age>=58?"#B5B5B5":HAIRC[h%4],mous:!f&&!kid&&age>40&&h%2===0,beard:!f&&!kid&&age<=40&&h%3===0,mood:c.m||"pain",extra:c.x||""};}
function norm(c){
 if(!c.av)c.av=autoAv(c);
 if(Array.isArray(c.v)){const [hr,bp,spo2,rr,t]=c.v;c.v={hr,bp,spo2,rr,t:t+"°"};}
 if(typeof c.ab==="string")c.ab=c.ab.split(" ").filter(Boolean);c.ab=c.ab||[];
 ["H","E","T"].forEach(k=>c[k]=c[k].map(([q,a,key,v])=>({q,a,key:!!key,v})));
}

function startCase(id){const cc=CASES.find(c=>c.id===id),order=cc.o.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}Object.assign(S,{order,view:"case",c:cc,tab:"H",seen:new Set(),fresh:null,points:START,hint:false,choice:null,sheet:false,result:null});render();scrollTo(0,0);}

function rankInfo(total){let i=0;RANKS.forEach((r,j)=>{if(total>=r[0])i=j;});const cur=RANKS[i],nxt=RANKS[i+1];return{cur,nxt,pct:nxt?((total-cur[0])/(nxt[0]-cur[0]))*100:100};}

function confetti(){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const cols=["#E0564B","#2F7DD8","#C2479A","#E08A1E","#F2A900","#5B4BDB","#2BB673"];
 for(let i=0;i<70;i++){const d=document.createElement("i");d.className="confetti";
  d.style.left=Math.random()*100+"vw";d.style.background=cols[i%cols.length];
  d.style.setProperty("--dx",(Math.random()*160-80)+"px");d.style.setProperty("--rot",(Math.random()*900-450)+"deg");
  d.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),3200);}
}

function render(){app.innerHTML=S.view==="home"?homeView():S.view==="case"?caseView():resultView();S.fresh=null;}

app.addEventListener("click",e=>{
 const el=e.target.closest("[data-act]");if(!el)return;const act=el.dataset.act;
 if(act==="close-bg"&&e.target!==el)return;
 switch(act){
  case "filter":S.filter=el.dataset.f;render();if(el.classList.contains("more"))scrollTo(0,0);break;
  case "random":{const pool=CASES.filter(c=>S.filter==="All"||c.s===S.filter);const fresh=pool.filter(c=>best[c.id]==null);const pick=(fresh.length?fresh:pool)[Math.floor(Math.random()*(fresh.length||pool.length))];startCase(pick.id);break;}
  case "open":startCase(el.dataset.id);break;
  case "home":S.view="home";render();scrollTo(0,0);break;
  case "tab":S.tab=el.dataset.k;render();break;
  case "ask":{const key=S.tab+el.dataset.j;if(!S.seen.has(key)){S.seen.add(key);S.points=Math.max(0,S.points-COST[S.tab]);S.fresh=key;}render();break;}
  case "hint":if(!S.hint){S.hint=true;S.points=Math.max(0,S.points-HINT);}render();break;
  case "sheet":S.sheet=true;render();break;
  case "close":case "close-bg":S.sheet=false;render();break;
  case "pick":S.choice=+el.dataset.k;render();break;
  case "confirm":{
   if(S.choice==null)return;const c=S.c,correct=S.choice===c.ans,score=correct?Math.max(S.points,10):0;
   const prev=best[c.id],isBest=correct&&(prev==null||score>prev);
   if(prev==null||score>prev)best[c.id]=score;streak=correct?streak+1:0;save();
   S.result={correct,score,stars:starsFor(score),choice:S.choice,isBest};S.sheet=false;S.view="result";render();scrollTo(0,0);
   if(correct)confetti();break;}
 }
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.sheet){S.sheet=false;render();}});
render();
</script>
